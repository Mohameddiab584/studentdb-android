name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1); fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build web app and sync Capacitor
        run: |
          cd app-src
          npm ci
          npm run build
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        run: |
          cd app-src/android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: studentdb-apk
          path: app-src/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-debug
          name: StudentDB Android APK (debug)
          body: Debug APK built automatically from this repo.
          files: app-src/android/app/build/outputs/apk/debug/app-debug.apk
